[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "storygraph-novel"
version = "0.2.0"
description = "Local narrative relationship graph for AI writing and analysis agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["networkx>=3.4"]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
storygraph = "storygraph.cli:main"

[tool.setuptools]
packages = ["storygraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
