[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "storygraph-novel"
version = "0.1.0"
description = "Novel and story knowledge graph tool inspired by Graphify"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["networkx>=3.4"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
mcp = ["mcp>=1,<3"]
all = ["openai>=1.0", "mcp>=1,<3"]

[project.scripts]
storygraph = "storygraph.cli:main"

[tool.setuptools]
packages = ["storygraph"]
